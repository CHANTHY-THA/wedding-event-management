<div class="create-page">
  <header class="create-topbar">
    <a class="create-brand" routerLink="/events" aria-label="PlanEssential">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <path
          d="M20 34s-13-7.8-13-17a7.2 7.2 0 0 1 13-4.3A7.2 7.2 0 0 1 33 17c0 9.2-13 17-13 17Z"
          fill="currentColor"
        />
        <path d="M7 8 4 5m31 1-3 3M5 22l-3 1m34-1 2 1" />
      </svg>
      <span>E-Planner</span>
    </a>
    <a class="create-events-link" routerLink="/events">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 4h6v6H4zM14 4h6v4h-6zM14 12h6v8h-6zM4 14h6v6H4z" />
      </svg>
      {{ 'Events' | t }}
    </a>
    <div class="create-topbar-actions">
      <button class="create-language-button" type="button" (click)="toggleLanguage()">
        {{ language() === 'en' ? 'ខ្មែរ' : 'EN' }}
      </button>
      <span class="create-profile-avatar" [attr.aria-label]="session()?.name ?? 'Planner profile'">
        {{ (session()?.name ?? 'P').slice(0, 1).toUpperCase() }}
      </span>
    </div>
  </header>

  <main class="create-main">
    <section class="create-panel">
      <h1>{{ (editingEvent() ? 'Edit event' : 'Create event') | t }}</h1>

      <form (ngSubmit)="submit()">
        <div class="cover-section">
          <label for="cover-photo">{{ 'Link preview' | t }}</label>
          <div class="cover-preview">
            @if (coverPhotoUrl()) {
              <img [src]="coverPhotoUrl()" alt="Event cover preview" />
            } @else {
              <div class="cover-empty">{{ 'No cover image selected' | t }}</div>
            }
          </div>
          <div class="cover-actions">
            <label class="upload-cover-button" for="cover-photo">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 16V4m-4 4 4-4 4 4M5 14v5h14v-5" />
              </svg>
              {{ 'Upload photo' | t }}
            </label>
            <input
              id="cover-photo"
              class="cover-file-input"
              type="file"
              accept="image/*"
              (change)="chooseCoverPhoto($event)"
            />
            @if (coverPhotoUrl()) {
              <button
                class="remove-cover-button"
                type="button"
                [attr.aria-label]="'Remove cover photo' | t"
                (click)="removeCoverPhoto()"
              >
                ×
              </button>
            }
          </div>
        </div>

        <div class="create-form-grid">
          <label>
            {{ 'Event name' | t }} <span class="required-mark">*</span>
            <input
              type="text"
              [value]="draft().name"
              (input)="updateField('name', $event)"
              [placeholder]="'e.g. Our wedding celebration' | t"
              required
            />
          </label>
          <label>
            {{ 'Event type' | t }} <span class="required-mark">*</span>
            <select
              [value]="draft().type"
              (change)="updateField('type', $event)"
              required
            >
              <option value="Wedding">{{ 'Wedding' | t }}</option>
              <option value="Engagement">{{ 'Engagement' | t }}</option>
              <option value="Birthday">{{ 'Birthday' | t }}</option>
              <option value="Other">{{ 'Other' | t }}</option>
            </select>
          </label>
          <label>
            {{ 'Partner one' | t }} <span class="required-mark">*</span>
            <input
              type="text"
              [value]="draft().partnerOne"
              (input)="updateField('partnerOne', $event)"
              [placeholder]="'Enter first partner name' | t"
              required
            />
          </label>
          <label>
            {{ 'Partner two' | t }} <span class="required-mark">*</span>
            <input
              type="text"
              [value]="draft().partnerTwo"
              (input)="updateField('partnerTwo', $event)"
              [placeholder]="'Enter second partner name' | t"
              required
            />
          </label>
          <label>
            {{ 'Event date' | t }} <span class="required-mark">*</span>
            <input
              type="date"
              [value]="draft().date"
              (input)="updateField('date', $event)"
              required
            />
          </label>
          <label>
            {{ 'Start time' | t }} <span class="required-mark">*</span>
            <input
              type="time"
              [value]="draft().time"
              (input)="updateField('time', $event)"
              required
            />
          </label>
          <label>
            {{ 'Venue' | t }} <span class="required-mark">*</span>
            <input
              type="text"
              [value]="draft().venue"
              (input)="updateField('venue', $event)"
              [placeholder]="'Venue name' | t"
              required
            />
          </label>
          <label>
            {{ 'City' | t }} <span class="required-mark">*</span>
            <input
              type="text"
              [value]="draft().city"
              (input)="updateField('city', $event)"
              [placeholder]="'City or province' | t"
              required
            />
          </label>
          <label>
            {{ 'Venue address (optional)' | t }}
            <textarea
              rows="2"
              [value]="draft().venueAddress"
              (input)="updateField('venueAddress', $event)"
              [placeholder]="'Enter the full venue address' | t"
            ></textarea>
          </label>
          <label>
            {{ 'Map link (optional)' | t }}
            <textarea
              rows="2"
              [value]="draft().mapUrl"
              (input)="updateField('mapUrl', $event)"
              [placeholder]="'Paste a map link' | t"
            ></textarea>
          </label>
        </div>

        <details class="additional-dates">
          <summary>
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <rect x="4" y="5" width="16" height="16" rx="2" />
              <path d="M8 3v4m8-4v4M4 10h16" />
            </svg>
            {{ 'Additional dates' | t }}
          </summary>
          <label>
            {{ 'RSVP deadline (optional)' | t }}
            <input
              type="date"
              [value]="draft().rsvpDeadline ?? ''"
              (input)="updateField('rsvpDeadline', $event)"
            />
          </label>
        </details>

        <div class="create-form-actions">
          <a class="back-to-events" routerLink="/events">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6" /></svg>
            {{ 'Back' | t }}
          </a>
          <button class="submit-event-button" type="submit">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4 4L19 6" /></svg>
            {{ (editingEvent() ? 'Save changes' : 'Create event') | t }}
          </button>
        </div>
      </form>
    </section>
  </main>
</div>
